{
  "apiVersion": "services.eda.nokia.com/v2",
  "kind": "VirtualNetwork",
  "metadata": {
    "name": "vnet-1",
    "namespace": "clab-srl-leaf-spine-dcgw"
  },
  "spec": {
    "bridgeDomains": [
      {
        "name": "bd-1",
        "spec": {
          "encapOptions": {
            "vxlan": {
              "tunnelIndexPool": "tunnel-index-pool",
              "vni": 201,
              "vniPool": "vni-pool"
            }
          },
          "evi": 101,
          "eviPool": "evi-pool",
          "exportTarget": "target:1:101",
          "importTarget": "target:1:101",
          "macLearning": {
            "agingTimeSeconds": 300,
            "enabled": true
          },
          "macLimit": 2000,
          "type": "EVPNVXLAN"
        }
      }
    ],
    "irbInterfaces": [
      {
        "name": "irb-1",
        "spec": {
          "bridgeDomain": "bd-1",
          "evpnRouteAdvertisementType": {
            "arpDynamic": true,
            "arpStatic": true,
            "ndDynamic": true,
            "ndStatic": true,
            "rfc9135SymmetricMode": true
          },
          "hostRoutePopulate": {
            "evpn": {
              "datapathProgramming": true,
              "populate": true
            }
          },
          "indexAllocation": {
            "indexPool": "irb-subif-pool",
            "mode": "GlobalPool"
          },
          "ipAddresses": [
            {
              "ipv4Address": {
                "anycast": true,
                "ipPrefix": "172.16.101.254/24",
                "primary": true
              }
            },
            {
              "ipv6Address": {
                "ipPrefix": "fc00:11::1/120",
                "primary": true
              }
            }
          ],
          "ipMTU": 1500,
          "ipv4": {
            "arpTimeoutSeconds": 14400,
            "learnUnsolicitedARP": "Disabled"
          },
          "ipv6": {
            "learnUnsolicitedNA": "Disabled"
          },
          "router": "router-1"
        }
      }
    ],
    "protocols": {},
    "routers": [
      {
        "name": "router-1",
        "spec": {
          "bgp": {
            "autonomousSystem": 65401,
            "ebgpPreference": 170,
            "enabled": true,
            "ibgpPreference": 170,
            "ipv4Unicast": {
              "enabled": true
            },
            "minWaitToAdvertiseSeconds": 0,
            "rapidWithdrawl": true,
            "waitForFIBInstall": false
          },
          "encapOptions": {
            "vxlan": {
              "tunnelIndexPool": "tunnel-index-pool",
              "vni": 200,
              "vniPool": "vni-pool"
            }
          },
          "evi": 100,
          "eviPool": "evi-pool",
          "exportTarget": "target:1:100",
          "importTarget": "target:1:100",
          "routerID": "1.2.3.4",
          "type": "EVPNVXLAN"
        }
      }
    ],
    "vlans": [
      {
        "name": "vlan-null-vnet-1",
        "spec": {
          "bridgeDomain": "bd-1",
          "interfaceSelectors": [
            "eda.nokia.com/vnet-1=vlan-bd-1"
          ],
          "vlanID": "null"
        }
      }
    ]
  }
}
