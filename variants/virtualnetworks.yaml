apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-vlan
  namespace: clab-3-tier-leaf-spine-dcgw
spec:
  bridgeDomains:
  - name: bd-ms-vlan
    spec:
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      macLimit: 2000
      type: EVPNVXLAN
  bridgeInterfaces: []
  irbInterfaces:
  - name: irb-ms-vlan
    spec:
      bridgeDomain: bd-ms-vlan
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
        rfc9135SymmetricMode: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.75.254/24
          primary: true
      ipMTU: 1500
      router: router-ms-vlan
  routedInterfaces: []
  routers:
  - name: router-ms-vlan
    spec:
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 3.4.5.6
      type: EVPNVXLAN
  vlans:
  - name: vlan-ms-vlan-red
    spec:
      bridgeDomain: bd-ms-vlan
      description: Red client leaf-1
      interfaceSelectors:
      - eda.nokia.com/ms-group=red,eda.nokia.com/vnet-ms-vlan=bd-ms-vlan
      vlanID: '75'
  - name: vlan-ms-vlan-blue
    spec:
      bridgeDomain: bd-ms-vlan
      description: Blue client leaf-2
      interfaceSelectors:
      - eda.nokia.com/ms-group=blue,eda.nokia.com/vnet-ms-vlan=bd-ms-vlan
      vlanID: '75'
  - name: vlan-ms-vlan-green
    spec:
      bridgeDomain: bd-ms-vlan
      description: Green client leaf-3
      interfaceSelectors:
      - eda.nokia.com/ms-group=green,eda.nokia.com/vnet-ms-vlan=bd-ms-vlan
      vlanID: '75'
---
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-bridge
  namespace: clab-3-tier-leaf-spine-dcgw
  annotations:
    eda.nokia.com/ms-demo-description: "VARIANT-B \u0393\xC7\xF6 GroupTag via BridgeInterface\
      \ (explicit bi-* CRs + bridgeInterfaceSelectors). Enforcement serviceTargets.virtualNetworks."
  labels:
    eda.nokia.com/ms-variant: bridge-interface-association
spec:
  bridgeDomains:
  - name: bd-ms-bridge
    spec:
      description: "VARIANT-B bridge-interface association \u0393\xC7\xF6 red/blue/green"
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      type: EVPNVXLAN
  bridgeInterfaces:
  - name: bi-red-5
    spec:
      bridgeDomain: bd-ms-bridge
      description: "Red client \u0393\xC7\xF6 leaf-5 ethernet-1/5 (association target\
        \ bi-red-5)"
      interface: leaf-5-ethernet-1-5
      vlanID: '75'
  - name: bi-blue-6
    spec:
      bridgeDomain: bd-ms-bridge
      description: "Blue client \u0393\xC7\xF6 leaf-6 ethernet-1/5"
      interface: leaf-6-ethernet-1-5
      vlanID: '75'
  - name: bi-green-7
    spec:
      bridgeDomain: bd-ms-bridge
      description: "Green client \u0393\xC7\xF6 leaf-7 ethernet-1/5"
      interface: leaf-7-ethernet-1-5
      vlanID: '75'
  irbInterfaces:
  - name: irb-ms-bridge
    spec:
      bridgeDomain: bd-ms-bridge
      description: Gateway 172.16.75.254/24
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
        rfc9135SymmetricMode: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.75.254/24
          primary: true
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      router: router-ms-bridge
      virtualIPDiscovery: []
  routedInterfaces: []
  routers:
  - name: router-ms-bridge
    spec:
      description: "L3 router for vnet-ms-bridge \u0393\xC7\xF6 policy on virtualNetwork\
        \ target"
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 10.2.2.1
      type: EVPNVXLAN
  vlans: []
---
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-routed
  namespace: clab-3-tier-leaf-spine-dcgw
  annotations:
    eda.nokia.com/ms-demo-description: "VARIANT-C \u0393\xC7\xF6 GroupTag via RoutedInterface\
      \ selectors (L3 handoff, no BD/IRB). Enforcement serviceTargets.virtualNetworks."
  labels:
    eda.nokia.com/ms-variant: routed-interface-association
spec:
  bridgeDomains: []
  bridgeInterfaces: []
  irbInterfaces: []
  routedInterfaces:
  - name: ri-red-5
    spec:
      description: "Red \u0393\xC7\xF6 routed interface 172.16.80.1/24 on leaf-5"
      interface: leaf-5-ethernet-1-5
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      ipv4Addresses:
      - ipPrefix: 172.16.80.1/24
        primary: true
      router: router-ms-routed
      vlanID: '80'
      vlanPool: vlan-pool
  - name: ri-blue-6
    spec:
      description: "Blue \u0393\xC7\xF6 routed interface 172.16.81.1/24 on leaf-6"
      interface: leaf-6-ethernet-1-5
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      ipv4Addresses:
      - ipPrefix: 172.16.81.1/24
        primary: true
      router: router-ms-routed
      vlanID: '81'
      vlanPool: vlan-pool
  - name: ri-green-7
    spec:
      description: "Green \u0393\xC7\xF6 routed interface 172.16.82.1/24 on leaf-7"
      interface: leaf-7-ethernet-1-5
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      ipv4Addresses:
      - ipPrefix: 172.16.82.1/24
        primary: true
      router: router-ms-routed
      vlanID: '82'
      vlanPool: vlan-pool
  routers:
  - name: router-ms-routed
    spec:
      description: L3-only router for routed-interface association demo
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 10.3.3.1
      type: EVPNVXLAN
  vlans: []
---
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-irb
  namespace: clab-3-tier-leaf-spine-dcgw
  annotations:
    eda.nokia.com/ms-demo-description: "VARIANT-D — IRB gateway enforcement on vnet-ms-irb. Scoped leaf-2/3/4 only: leaf-2=blue (client2), leaf-3=green (client3), leaf-4=red (client4). VLAN 85; irb-ms-irb→gateway; VLAN helpers tag clients."
  labels:
    eda.nokia.com/ms-variant: irb-interface-association
spec:
  bridgeDomains:
  - name: bd-ms-irb
    spec:
      description: L2 BD for IRB-interface association demo (leaf-2/3/4)
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      type: EVPNVXLAN
  bridgeInterfaces: []
  irbInterfaces:
  - name: irb-ms-irb
    spec:
      bridgeDomain: bd-ms-irb
      description: Gateway IRB association target for GroupTag gateway
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
        rfc9135SymmetricMode: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.85.254/24
          primary: true
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      router: router-ms-irb
      virtualIPDiscovery: []
  routedInterfaces: []
  routers:
  - name: router-ms-irb
    spec:
      description: Router for vnet-ms-irb — no nodeSelectors (scoped via VLAN label selectors on leaf-2/3/4 only)
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 10.5.5.1
      type: EVPNVXLAN
  vlans:
  - name: vlan-ms-irb-red
    spec:
      bridgeDomain: bd-ms-irb
      description: Red — leaf-4 / client4 (172.16.85.4)
      interfaceSelectors:
      - eda.nokia.com/ms-group=red,eda.nokia.com/vnet-ms-irb=bd-ms-irb
      vlanID: '85'
  - name: vlan-ms-irb-blue
    spec:
      bridgeDomain: bd-ms-irb
      description: Blue — leaf-2 / client2 (172.16.85.2)
      interfaceSelectors:
      - eda.nokia.com/ms-group=blue,eda.nokia.com/vnet-ms-irb=bd-ms-irb
      vlanID: '85'
  - name: vlan-ms-irb-green
    spec:
      bridgeDomain: bd-ms-irb
      description: Green — leaf-3 / client3 (172.16.85.3)
      interfaceSelectors:
      - eda.nokia.com/ms-group=green,eda.nokia.com/vnet-ms-irb=bd-ms-irb
      vlanID: '85'
---
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-static
  namespace: clab-3-tier-leaf-spine-dcgw
  annotations:
    eda.nokia.com/ms-demo-description: "VARIANT-E — StaticRoute association on vnet-ms-static. Scoped leaf-6/7/8 only: leaf-6=blue (client6), leaf-7=green (client7), leaf-8=red (client8). VLAN 90; static-remote-green tags 172.16.91.0/24 green. Enforcement serviceTargets.virtualNetworks."
  labels:
    eda.nokia.com/ms-variant: static-route-association
spec:
  bridgeDomains:
  - name: bd-ms-static
    spec:
      description: L2 BD for static-route association demo
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      type: EVPNVXLAN
  bridgeInterfaces: []
  irbInterfaces:
  - name: irb-ms-static
    spec:
      bridgeDomain: bd-ms-static
      description: Gateway 172.16.90.254/24
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
        rfc9135SymmetricMode: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.90.254/24
          primary: true
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      router: router-ms-static
      virtualIPDiscovery: []
  protocols:
    staticRoutes:
    - name: static-remote-green
      spec:
        nexthopGroup:
          blackhole: true
          resolve: false
        prefixes:
        - 172.16.91.0/24
        router: router-ms-static
  routedInterfaces: []
  routers:
  - name: router-ms-static
    spec:
      description: Router for vnet-ms-static — no nodeSelectors (scoped via VLAN label selectors on leaf-6/7/8 only)
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      routerID: 10.6.6.1
      type: EVPNVXLAN
  vlans:
  - name: vlan-ms-static-red
    spec:
      bridgeDomain: bd-ms-static
      description: Red — leaf-8 / client8 (172.16.90.8)
      interfaceSelectors:
      - eda.nokia.com/ms-group=red,eda.nokia.com/vnet-ms-static=bd-ms-static
      vlanID: '90'
  - name: vlan-ms-static-blue
    spec:
      bridgeDomain: bd-ms-static
      description: Blue — leaf-6 / client6 (172.16.90.6)
      interfaceSelectors:
      - eda.nokia.com/ms-group=blue,eda.nokia.com/vnet-ms-static=bd-ms-static
      vlanID: '90'
  - name: vlan-ms-static-green
    spec:
      bridgeDomain: bd-ms-static
      description: Green — leaf-7 / client7 (172.16.90.7)
      interfaceSelectors:
      - eda.nokia.com/ms-group=green,eda.nokia.com/vnet-ms-static=bd-ms-static
      vlanID: '90'
---
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata:
  name: vnet-ms-enf-router
  namespace: clab-3-tier-leaf-spine-dcgw
  annotations:
    eda.nokia.com/ms-demo-description: "VARIANT-F \u0393\xC7\xF6 Same VLAN client\
      \ tagging as VARIANT-A but MicroSegmentationPolicy serviceTargets.routers (router-ms-enf-router)\
      \ instead of virtualNetworks."
  labels:
    eda.nokia.com/ms-variant: enforcement-router-target
spec:
  bridgeDomains:
  - name: bd-ms-enf-router
    spec:
      description: BD for enforcement-router-target demo
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      macLearning:
        agingTimeSeconds: 300
        enabled: true
      type: EVPNVXLAN
  bridgeInterfaces: []
  irbInterfaces:
  - name: irb-ms-enf-router
    spec:
      bridgeDomain: bd-ms-enf-router
      description: Gateway 172.16.100.254/24
      evpnRouteAdvertisementType:
        arpDynamic: true
        arpStatic: true
        ndDynamic: true
        ndStatic: true
        rfc9135SymmetricMode: true
      ipAddresses:
      - ipv4Address:
          ipPrefix: 172.16.100.254/24
          primary: true
      ipMTU: 1500
      ipv4:
        arpTimeoutSeconds: 14400
        learnUnsolicitedARP: Disabled
      router: router-ms-enf-router
      virtualIPDiscovery: []
  routedInterfaces: []
  routers:
  - name: router-ms-enf-router
    spec:
      description: GBP ACL applied via serviceTargets.routers (not virtualNetworks)
      encapOptions:
        vxlan:
          tunnelIndexPool: tunnel-index-pool
          vniPool: vni-pool
      eviPool: evi-pool
      nodeSelectors:
      - eda.nokia.com/role=leaf
      routerID: 10.7.7.1
      type: EVPNVXLAN
  vlans:
  - name: vlan-enf-router-red
    spec:
      bridgeDomain: bd-ms-enf-router
      interfaceSelectors:
      - eda.nokia.com/ms-group=red,eda.nokia.com/vnet-ms-enf-router=bd-ms-enf-router
      vlanID: '100'
  - name: vlan-enf-router-blue
    spec:
      bridgeDomain: bd-ms-enf-router
      interfaceSelectors:
      - eda.nokia.com/ms-group=blue,eda.nokia.com/vnet-ms-enf-router=bd-ms-enf-router
      vlanID: '100'
  - name: vlan-enf-router-green
    spec:
      bridgeDomain: bd-ms-enf-router
      interfaceSelectors:
      - eda.nokia.com/ms-group=green,eda.nokia.com/vnet-ms-enf-router=bd-ms-enf-router
      vlanID: '100'
---
